<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shipping Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-layout">

        <aside class="admin-sidebar">
            <h2 class="admin-logo">Leaf</h2>
        </aside>

        <main class="admin-main">
            <h1>Shipping</h1>

            <div class="manage-card">
                <h3>Add Shipping Zone</h3>
                <input type="text" placeholder="Country / Zone">
                <input type="number" placeholder="Price €">
                <button class="btn-green">Add</button>
            </div>

            <div class="manage-card">
                <h3>Existing Zones</h3>
                <p>Europe – €5.00</p>
                <button class="btn-outline">Edit</button>
                <button class="btn-outline">Delete</button>
            </div>

        </main>

    </div>
</body>
</html>
